[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-agent"
version = "0.1.0"
description = "Platform-neutral restaurant finding agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=42,<45",
    "httpx>=0.28,<1",
    "openai-agents>=0.0.19",
    "pydantic-settings>=2.6,<3",
    "socksio>=1,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: calls the configured Responses API provider",
]

[tool.setuptools.packages.find]
where = ["src"]
